{% extends "base.html" %}
{% block title %}Sozlamalar{% endblock %}
{% block content %}
<h1>Sozlamalar</h1>
<div class="card">
  <form method="post" action="/admin/settings">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="grid g2">
    {% for key, kind, default, label, help in defs %}
      <div>
        {% if kind == 'bool' %}
          <label class="check"><input type="checkbox" name="{{ key }}" {{ 'checked' if values[key] }}> {{ label }}</label>
        {% else %}
          <label>{{ label }}</label><input type="number" min="0" name="{{ key }}" value="{{ values[key] }}">
        {% endif %}
        <div class="hint">{{ help }}</div>
      </div>
    {% endfor %}
    </div>
    <div class="actions"><button class="btn primary">Saqlash</button></div>
  </form>
</div>

<div class="card" style="max-width:480px">
  <h3>Parolni o'zgartirish</h3>
  <form method="post" action="/admin/settings/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Joriy parol</label><input type="password" name="current" required autocomplete="current-password">
    <label>Yangi parol (kamida 8 belgi)</label><input type="password" name="new" required minlength="8" autocomplete="new-password">
    <label>Yangi parol (takror)</label><input type="password" name="repeat" required minlength="8" autocomplete="new-password">
    <div class="actions"><button class="btn primary">O'zgartirish</button></div>
  </form>
</div>
{% endblock %}
